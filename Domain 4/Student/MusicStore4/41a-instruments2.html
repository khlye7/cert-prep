<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>File 4a - Section 2 Image Layouts and Links</title>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background-color: #fff0f5;
      padding: 20px;
      color: #660033;
    }
    table {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      border-collapse: collapse;
      text-align: center;
    }
    td {
      padding: 10px;
      vertical-align: top;
    }
    img {
      max-width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Featured Instruments</h1>
  <table>
    <tr>
      <td>
        <a href="images/mandolincloseup.jpg" target="_blank">
          <img src="images/mandolin.jpg" alt="mandolin" width="460" height="345" />
        </a>
      </td>
      <td>
        <img src="images/trombone.jpg" alt="trombone" width="460" height="345" />
      </td>
    </tr>
    <tr>
      <td>Mandolin</td>
      <td>Trombone</td>
    </tr>
  </table>
</body>
</html>
